<title>Barba Negra | Conceito Bar</title>
<meta name="description" content="Burgers, marmitaria e bar na Vila Industrial, Piracicaba. Peça pelo delivery próprio ou reserve sua mesa.">
<meta name="theme-color" content="#F2EEDF">
<meta property="og:title" content="Barba Negra | Conceito Bar">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --fundo: #F2EEDF;
    --azul: #101F2C;
    --vinho: #721C30;
    --ambar: #FE9B1E;
    --creme: #FCFCEB;
    --texto-suave: rgba(16, 31, 44, 0.64);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--fundo);
    color: var(--azul);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 26rem;
    min-height: 100vh;
    padding: 4rem 1.5rem 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo { display: block; width: min(15rem, 72vw); height: auto; }
  .frase {
    margin-top: 1.75rem;
    font-size: 1rem;
    line-height: 1.55;
    color: var(--texto-suave);
    max-width: 28ch;
  }
  nav {
    width: 100%;
    margin-top: 2.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .botao {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    width: 100%;
    height: 4.2rem;
    padding: 0 1.5rem;
    border-radius: 999px;
    text-decoration: none;
    text-align: left;
    background: var(--azul);
    color: var(--creme);
    transition: background-color 0.2s ease, transform 0.15s ease;
  }
  .botao:hover { background: #1A3044; }
  .botao:active { transform: scale(0.98); }
  .botao:focus-visible { outline: 2px solid var(--ambar); outline-offset: 4px; }
  .botao .txt { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .botao b { font-weight: 500; font-size: 1.02rem; }
  .botao small { font-size: 0.8rem; color: rgba(252, 252, 235, 0.68); margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seta { width: 1rem; height: 1rem; flex: none; opacity: 0.6; }
  .reserva { background: var(--vinho); }
  .reserva:hover { background: #84223A; }
  .oferta { margin-top: 1rem; font-size: 0.85rem; color: var(--texto-suave); }
  .oferta a { color: var(--vinho); font-weight: 500; text-decoration: none; border-bottom: 1px solid rgba(114, 28, 48, 0.35); }
  footer { margin-top: auto; padding-top: 3.5rem; font-size: 0.8rem; color: var(--texto-suave); }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .logo { animation: entrar 0.7s cubic-bezier(.2,.8,.2,1) both; }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } .botao { transition: none; } }
  @media (min-width: 40rem) { main { padding-top: 5.5rem; } }
</style>
